name: Nifty 500 Feature Engineering Pipeline

on:
  workflow_dispatch: 

jobs:
  build-distributed-features:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Distributed Feature Engine
        run: python feature_pipeline.py

      - name: Commit and Push Individual Feature Files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Stage the entire features directory containing the individual parquet files
          git add features/*.parquet
          
          git commit -m "Automated update: Distributed feature arrays generated" || exit 0
          
          git push
