name: Nifty 500 Feature Engineering Pipeline

on:
  workflow_dispatch: # Triggers manually from the Actions tab only

jobs:
  build-features:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas pyarrow

      - name: Run Feature Engineering Engine
        run: python feature_pipeline.py

      - name: Verify Output Artifact
        run: |
          if [ ! -f "features_dataset.parquet" ]; then
            echo "Error: features_dataset.parquet was not generated."
            exit 1
          fi
          ls -lh features_dataset.parquet

      - name: Commit and Push Feature Store
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add features_dataset.parquet
          
          git commit -m "Manual trigger: engineered feature matrix update" || exit 0
          
          git push
