name: Forward Testing Execution Dashboard

on:
  workflow_dispatch:
    inputs:
      portfolio_capital:
        description: 'Current Portfolio Capital (in INR)'
        required: false
        default: '100000000'
  schedule:
    # Runs at 10:30 UTC (4:00 PM IST) Monday to Friday after NSE close
    - cron: '30 10 * * 1-5'

permissions:
  contents: write

jobs:
  run-dashboard:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas lightgbm stable-baselines3 torch pyarrow

      - name: Run Forward Test Inference Engine
        env:
          PORTFOLIO_CAPITAL: ${{ github.event.inputs.portfolio_capital || '100000000' }}
        run: |
          python forward_test_dashboard.py

      - name: Upload Execution Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: execution-sheet
          path: |
            target_portfolio.json
            current_portfolio.json
            execution_orders.csv
