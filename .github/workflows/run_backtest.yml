name: Step 5 - Institutional Backtest Simulation

on:
  workflow_dispatch: 

jobs:
  execute-backtest:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Deterministic Backtest Engine
        run: python backtest_simulation.py

      # --- FIX: filename updated to match the fixed backtest_simulation.py, -------
      # which now writes institutional_backtest_results_holdout.csv (renamed on
      # purpose so it can't be confused with old, training-contaminated results).
      - name: Upload Tearsheet & Equity Curve
        uses: actions/upload-artifact@v4
        with:
          name: institutional-backtest-results
          path: institutional_backtest_results_holdout.csv
          retention-days: 30
      # -----------------------------------------------------------------------------
