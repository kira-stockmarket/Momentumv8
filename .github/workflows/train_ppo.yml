name: Step 4 - RL PPO Allocator Training

on:
  workflow_dispatch: 

jobs:
  train-rl-agent:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Torch and RL Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Train Institutional PPO Portfolio Allocator
        run: python train_ppo.py

      - name: Archive PPO Model Weights as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ppo-agent-binary
          path: best_ppo_agent.zip
          retention-days: 90

      # --- FIX: also archive the train/eval split marker --------------------------
      # train_ppo.py writes eval_start_date.txt to mark which dates the agent
      # was NOT trained on. Without uploading/committing it, it's lost when
      # this runner is torn down, and the separate run_backtest.yml job (on a
      # fresh runner) has no way to know the split — hence the "not found" error.
      - name: Archive Train/Eval Split Marker as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: eval-split-marker
          path: eval_start_date.txt
          retention-days: 90
      # -----------------------------------------------------------------------------

      - name: Commit PPO Agent Weights and Split Marker
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add best_ppo_agent.zip eval_start_date.txt
          git commit -m "Automated Step 4 Update: PPO Risk Allocator Policy + Eval Split Saved" || exit 0
          
          git pull origin main --rebase
          git push origin main
